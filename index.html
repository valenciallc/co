        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            padding: 20px;
            min-height: 100vh;
        }
        /* ===== Container ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 30px 35px 45px;
            transition: all 0.2s;
        }
        /* ===== Header ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 22px;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 span {
            background: #1e3a5f;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0;
        }
        .header .stats {
            font-size: 15px;
            color: #475569;
            background: #f1f5f9;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
        }
        /* ===== Search & Filters ===== */
        .search-section {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            align-items: center;
        }
        .search-box {
            flex: 1 1 320px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            background: #f8fafc;
            transition: all 0.25s;
            color: #0f172a;
            font-family: inherit;
        }
        .search-box input:focus {
            outline: none;
            border-color: #1e3a5f;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(30, 58, 95, 0.08);
        }
        .search-box input::placeholder {
            color: #94a3b8;
        }
        .search-box .icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 20px;
            pointer-events: none;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filter-group select {
            padding: 12px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            font-size: 15px;
            color: #0f172a;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 140px;
        }
        .filter-group select:focus {
            outline: none;
            border-color: #1e3a5f;
            background: #ffffff;
        }
        .clear-btn {
            padding: 12px 22px;
            background: #f1f5f9;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .clear-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        /* ===== Table ===== */
        .table-wrapper {
            border-radius: 16px;
            border: 1px solid #eef2f6;
            overflow: hidden;
            background: #ffffff;
        }
        .table-scroll {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        thead th {
            background: #f1f5f9;
            color: #0f172a;
            font-weight: 700;
            padding: 16px 20px;
            text-align: right;
            border-bottom: 2px solid #e2e8f0;
            font-size: 14px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        thead th:first-child {
            width: 22%;
            min-width: 150px;
        }
        thead th:nth-child(2) {
            width: 78%;
            min-width: 280px;
        }
        tbody tr {
            transition: background 0.15s;
            border-bottom: 1px solid #f1f5f9;
        }
        tbody tr:hover {
            background: #f8fafc;
        }
        tbody td {
            padding: 14px 20px;
            vertical-align: middle;
            line-height: 1.6;
        }
        tbody td:first-child {
            font-weight: 600;
            color: #1e3a5f;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        tbody td:first-child .badge-cat {
            display: inline-block;
            background: #eef2f6;
            color: #475569;
            font-size: 11px;
            font-weight: 600;
            padding: 0 8px;
            border-radius: 4px;
            margin-right: 6px;
            font-family: 'Segoe UI', sans-serif;
        }
        tbody td:nth-child(2) {
            color: #1e293b;
            font-weight: 500;
        }
        /* ===== Empty state ===== */
        .empty-row td {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            font-size: 17px;
        }
        .empty-row td span {
            display: block;
            font-size: 42px;
            margin-bottom: 12px;
        }
        /* ===== Scrollbar styling ===== */
        .table-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .container {
                padding: 18px 14px 28px;
                border-radius: 16px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .header h1 {
                font-size: 22px;
            }
            .header .stats {
                font-size: 13px;
                padding: 4px 14px;

                font-size: 15px;
            }
            .filter-group select {

                font-size: 14px;
                min-width: 110px;

            .clear-btn {
                padding: 10px 16px;
                font-size: 14px;
            }
            thead th,
            tbody td {
                padding: 12px 14px;
                font-size: 14px;
            }
            tbody td:first-child {
                font-size: 13px;
            }
            .table-scroll {

            }

            .container {
                padding: 12px 8px 20px;

            .header h1 {
                font-size: 19px;
                flex-wrap: wrap;
            }
            .search-section {
                flex-direction: column;
                gap: 10px;
            }
            .search-box {
                flex: 1 1 100%;
            }
            .filter-group {
                width: 100%;
                flex-wrap: wrap;
            }
            .filter-group select {
                flex: 1 1 45%;
                min-width: 80px;
                font-size: 13px;
                padding: 10px 12px;
            }
            .clear-btn {
                flex: 1 1 100%;
                text-align: center;
            }
            thead th,
            tbody td {
                padding: 10px 10px;
                font-size: 13px;
            }
            tbody td:first-child {
                font-size: 12px;
                min-width: 100px;
            }

        /* ===== Print ===== */
        @media print {
            body {
                background: #fff;
                padding: 10px;
            }
            .container {
                box-shadow: none;
                border: 1px solid #ddd;
                padding: 20px;
            }
            .search-section,
            .clear-btn {
                display: none !important;
            }
            .table-scroll {
                max-height: none;
                overflow: visible;
            }
            thead {
                position: static;
            }
            tbody tr:hover {
                background: transparent;
            }
        }
        /* ===== Loading shimmer (optional) ===== */
        .highlight {
            background: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }
    </style>
</head>

        // ============================================================
        //  RENDER ENGINE

        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const clearBtn = document.getElementById('clearBtn');
        const tableBody = document.getElementById('tableBody');
        const statsDisplay = document.getElementById('statsDisplay');
        const tableScroll = document.getElementById('tableScroll');

        // Helper: get category from name
        function getCategory(name) {
            const lower = name.toLowerCase();
            if (lower.includes('سوري')) return 'سوري';
            if (lower.includes('مصري')) return 'مصري';
            if (lower.includes('اردني')) return 'اردني';
            if (lower.includes('فلسطيني')) return 'فلسطيني';
            if (lower.includes('سعودي')) return 'سعودي';
            if (lower.includes('باكستاني')) return 'باكستاني';
            if (lower.includes('تركي')) return 'تركي';
            if (lower.includes('عماني')) return 'عماني';
            if (lower.includes('هندي')) return 'هندي';
            if (lower.includes('ديكور')) return 'ديكور';
            if (lower.includes('رخام') || lower.includes('غرانيت') || lower.includes('ماربل') || lower.includes(
                'galaxy')) return 'رخام';
            return 'أخرى';
        }

        // Render table
        function render(filterText = '', category = '') {
            const query = filterText.trim().toLowerCase();

            const filtered = products.filter(p => {
                // Category filter
                if (category) {
                    const cat = getCategory(p.name);
                    if (cat !== category) return false;
                }
                // Text search (code or name)
                if (query) {
                    const codeMatch = p.code.toLowerCase().includes(query);
                    const nameMatch = p.name.toLowerCase().includes(query);
                    if (!codeMatch && !nameMatch) return false;
                }
                return true;
            });

            // Update stats
            statsDisplay.textContent = `📦 ${filtered.length} من ${products.length} صنف`;

            if (filtered.length === 0) {
                tableBody.innerHTML = `
                    <tr class="empty-row">
                        <td colspan="2">
                            <span>🔍</span>
                            لا توجد نتائج تطابق بحثك<br>
                            <small style="font-weight:400;color:#94a3b8;">جرب كوداً أو اسمًا آخر</small>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            for (const p of filtered) {
                // Highlight matching text in name (simple version)
                let displayName = p.name;
                if (query) {
                    const idx = displayName.toLowerCase().indexOf(query);
                    if (idx !== -1) {
                        const before = displayName.slice(0, idx);
                        const match = displayName.slice(idx, idx + query.length);
                        const after = displayName.slice(idx + query.length);
                        displayName = `${before}<span class="highlight">${match}</span>${after}`;
                    }
                }
                const cat = getCategory(p.name);
                html += `
                    <tr>
                        <td>
                            <span class="badge-cat">${cat}</span>
                            ${p.code}
                        </td>
                        <td>${displayName}</td>
                    </tr>
                `;
            }
            tableBody.innerHTML = html;
            // Scroll to top of table on new search
            if (tableScroll) tableScroll.scrollTop = 0;
        }

        // Event listeners
        searchInput.addEventListener('input', () => {
            render(searchInput.value, categoryFilter.value);
        });

        categoryFilter.addEventListener('change', () => {
            render(searchInput.value, categoryFilter.value);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            categoryFilter.value = '';
            render('', '');
            searchInput.focus();
        });

        // Initial render
        render('', '');

        // Optional: focus search on load
        setTimeout(() => searchInput.focus(), 100);
